; =====================================================================
; RhythmSleep — PlatformIO Build Configuration
; Target: ESP32-S3 N16R8 (16MB Flash, 8MB Octal PSRAM)
; =====================================================================

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- ESP32-S3 N16R8 Memory Configuration ---
board_build.arduino.memory_type = qio_opi      ; Quad Flash + Octal PSRAM
board_build.psram = enabled
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; --- Serial Monitor ---
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; --- Library Dependencies ---
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    adafruit/RTClib @ ^2.1.4
    dfrobot/DFRobotDFPlayerMini @ ^1.0.6
    kosme/arduinoFFT @ ^2.0.2
    bblanchon/ArduinoJson @ ^7.1.0

; --- Build Flags ---
build_flags =
    ; -- PSRAM --
    -DBOARD_HAS_PSRAM=1

    ; -- USB CDC (native USB serial on S3 dev boards) --
    -DARDUINO_USB_CDC_ON_BOOT=1

    ; -- TFT_eSPI Configuration (avoids editing library User_Setup.h) --
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_INVERSION_ON=1
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=38
    -DTFT_DC=39
    -DTFT_RST=40
    ; Fonts
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    ; SPI speed
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
